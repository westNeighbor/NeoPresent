        } catch (error) {
          console.error('NeoPresent could not load the presenter pointer font.', error);
        }
      };

      const updateLaserPointer = (pointer) => {
        latestLaserPointer = pointer;
        const { x, y, visible } = pointer;
        if (!laserPointer) {
          laserPointer = document.createElement('div');
          laserPointer.setAttribute('aria-hidden', 'true');
          Object.assign(laserPointer.style, {
            background: '#ff3b30',
            border: '2px solid rgba(255,255,255,.9)',
            borderRadius: '50%',
            boxShadow: '0 0 8px 3px rgba(255,59,48,.72)',
            fontFamily: 'system-ui, sans-serif',
            height: '14px',
            opacity: '0',
            pointerEvents: 'none',
            position: 'fixed',
            transform: 'translate(-50%, -50%)',
            transition: 'opacity 80ms linear',
            width: '14px',
            zIndex: '9999'
          });
          document.body.append(laserPointer);
        }

        const character = typeof pointer.symbol === 'string' ? pointer.symbol : '';
        laserPointer.textContent = character;
        laserPointer.style.fontFamily =
          typeof pointer.font === 'string' ? pointer.font : 'system-ui, sans-serif';
        laserPointer.style.setProperty('font-variant-emoji', 'text');
        Object.assign(
          laserPointer.style,
          character
            ? {
                background: 'transparent',
                border: '0',
                borderRadius: '0',
                boxShadow: 'none',
                color: '#ff3b30',
                fontSize: '1.8rem',
                height: 'auto',
                textShadow: '0 0 8px rgba(255,59,48,.72)',
                width: 'auto'
              }
            : {
                background: '#ff3b30',
                border: '2px solid rgba(255,255,255,.9)',
                borderRadius: '50%',
                boxShadow: '0 0 8px 3px rgba(255,59,48,.72)',
                color: 'transparent',
                fontSize: 'initial',
                height: '14px',
                textShadow: 'none',
                width: '14px'
              }
        );

        const bounds = getPresentationBounds();
        if (!visible || !bounds || !Number.isFinite(x) || !Number.isFinite(y)) {
          laserPointer.style.opacity = '0';
          return;
        }
        laserPointer.style.left = `${bounds.left + x * bounds.width}px`;
        laserPointer.style.top = `${bounds.top + y * bounds.height}px`;
        laserPointer.style.opacity = '1';
      };

      const copyMagnifierCanvases = (source, clone) => {
        const sourceCanvases = source.querySelectorAll('canvas');
        const cloneCanvases = clone.querySelectorAll('canvas');
        sourceCanvases.forEach((canvas, index) => {
          const target = cloneCanvases[index];
          if (!target || canvas.width === 0 || canvas.height === 0) return;
          try {
            target.width = canvas.width;
            target.height = canvas.height;
            target.getContext('2d')?.drawImage(canvas, 0, 0);
          } catch {
            // A cross-origin canvas cannot be copied, but its surrounding
            // vector/DOM content remains useful inside the lens.
          }
        });
      };

      const refreshMagnifierSlide = (source, bounds) => {
        if (!magnifierContent || !source) return;
        const clone = source.cloneNode(true);
        clone.classList.add('neopresent-magnifier-slide');
        clone.removeAttribute('id');
        clone.removeAttribute('data-neo-id');
        clone.querySelectorAll('[id], [data-neo-id]').forEach((node) => {
          node.removeAttribute('id');
          node.removeAttribute('data-neo-id');
        });
        copyMagnifierCanvases(source, clone);
        Object.assign(clone.style, {
          height: `${bounds.height}px`,
          minHeight: `${bounds.height}px`,
          minWidth: `${bounds.width}px`,
          width: `${bounds.width}px`
        });
        magnifierContent.replaceChildren(clone);
        magnifierSource = source;
        magnifierSlide = clone;
      };

      const updateMagnifier = (pointer = {}) => {
        latestMagnifierPointer = { ...latestMagnifierPointer, ...pointer };
        const { x, y, visible } = latestMagnifierPointer;
        const source = getPresentationSlide();
        const bounds = source?.getBoundingClientRect();
        if (!visible || !source || !bounds || !Number.isFinite(x) || !Number.isFinite(y)) {
          if (magnifier) magnifier.style.opacity = '0';
          return;
        }
        if (!magnifier) {
          magnifier = document.createElement('div');
          magnifier.className = 'neopresent-magnifier';
          magnifier.setAttribute('aria-hidden', 'true');
          magnifierContent = document.createElement('div');
          magnifierContent.className = 'neopresent-magnifier-content';
          magnifier.append(magnifierContent);
          document.body.append(magnifier);
        }
        if (magnifierSource !== source || !magnifierSlide?.isConnected) {
          refreshMagnifierSlide(source, bounds);
        }
        const requestedZoom = Number(latestMagnifierPointer.magnifierZoom);
        const requestedSize = Number(latestMagnifierPointer.magnifierSize);
        const zoom = Number.isFinite(requestedZoom)
          ? Math.max(1.2, Math.min(3, requestedZoom))
          : 1.7;
        const size = Number.isFinite(requestedSize)
          ? Math.max(160, Math.min(420, requestedSize))
          : 260;
        const radius = size / 2;
        magnifier.style.height = `${size}px`;
        magnifier.style.width = `${size}px`;
        magnifier.style.left = `${bounds.left + x * bounds.width}px`;
        magnifier.style.top = `${bounds.top + y * bounds.height}px`;
        magnifierSlide.style.transform = `translate(${radius - x * bounds.width * zoom}px, ${radius - y * bounds.height * zoom}px) scale(${zoom})`;
        magnifier.style.opacity = '1';
      };

      const updateAnnotationCursor = ({
        x,
        y,
        visible,
        symbol = '✍',
        color = '#ff3b30',
        font = 'system-ui, sans-serif'
      }) => {
        if (!annotationCursor) {
          annotationCursor = document.createElement('div');
          annotationCursor.setAttribute('aria-hidden', 'true');
          Object.assign(annotationCursor.style, {
            fontFamily: 'system-ui, sans-serif',
            fontSize: '3.6rem',
            opacity: '0',
            pointerEvents: 'none',
            position: 'fixed',
            // User-calibrated visible ✍ pencil-tip anchor: x=6%, y=76%.
            transform: 'translate(-6%, -76%)',
            transformOrigin: 'top left',
            transition: 'opacity 80ms linear',
            zIndex: '9999'
          });
          document.body.append(annotationCursor);
        }
        annotationCursor.textContent = String(symbol || '✍').replaceAll('\ufe0f', '') + '\ufe0e';
        annotationCursor.style.color = color;
        annotationCursor.style.fontFamily = font || 'system-ui, sans-serif';
        annotationCursor.style.setProperty('font-variant-emoji', 'text');
        annotationCursor.style.textShadow = `0 0 8px ${color}`;
        const bounds = getPresentationBounds();
        if (!visible || !bounds || !Number.isFinite(x) || !Number.isFinite(y)) {
          annotationCursor.style.opacity = '0';
          return;
        }
        annotationCursor.style.left = `${bounds.left + x * bounds.width}px`;
        annotationCursor.style.top = `${bounds.top + y * bounds.height}px`;
        annotationCursor.style.opacity = '1';
      };

      const standalonePointerPoint = (event) => {
        const bounds = getPresentationBounds();
        if (
          !bounds ||
          event.clientX < bounds.left ||
          event.clientX > bounds.right ||
          event.clientY < bounds.top ||
          event.clientY > bounds.bottom
        )
          return null;
        return {
          x: Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width)),
          y: Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height))
        };
      };

      const updateStandalonePointer = (event) => {
        const point = standalonePointerPoint(event);
        if (!point) {
          if (standaloneLaserEnabled) updateLaserPointer({ visible: false });
          if (standaloneMagnifierEnabled) updateMagnifier({ visible: false });
          if (standaloneSpotlightEnabled)
            updateSpotlightScreen({
              ...standalonePointerPosition,
              visible: false
            });
          if (standaloneAnnotationEnabled || standaloneAnnotationEraserEnabled)
            updateAnnotationCursor({ visible: false });
          return;
        }
        standalonePointerPosition = point;
        if (standaloneLaserEnabled) updateLaserPointer({ ...point, symbol: '', visible: true });
        if (standaloneMagnifierEnabled) updateMagnifier({ ...point, visible: true });
        if (standaloneSpotlightEnabled)
          updateSpotlightScreen({ ...point, size: 14, visible: true });
        if (standaloneAnnotationEnabled || standaloneAnnotationEraserEnabled)
          updateAnnotationCursor({
            ...point,
            symbol: standaloneAnnotationEraserEnabled ? '⌫' : '✍',
            color: '#ff3b30',
            visible: true
          });
      };

      let presenterFilmstripScrollRatio = 0;
      const applyPresenterFilmstripScroll = () => {
        const filmstrip = document.querySelector('[data-neopresent-filmstrip]');
        if (!filmstrip) return;
        const maximum = Math.max(0, filmstrip.scrollWidth - filmstrip.clientWidth);
        filmstrip.style.scrollBehavior = 'auto';
        filmstrip.scrollLeft = maximum * presenterFilmstripScrollRatio;
      };
      const presenterIsOpen = () => Date.now() - presenterLastSeenAt < 2500;
      const notePresenterPresence = () => {
        const wasOpen = presenterIsOpen();
        presenterLastSeenAt = Date.now();
        if (wasOpen) return;
        standaloneAudienceBlanked = false;
        standaloneLaserEnabled = false;
        standaloneMagnifierEnabled = false;
        standaloneSpotlightEnabled = false;
        standaloneAnnotationEnabled = false;
        standaloneAnnotationEraserEnabled = false;
        activeAnnotationPath = undefined;
        updateBlackoutScreen(false);
        updateLaserPointer({ visible: false });
        updateMagnifier({ visible: false });
        updateAnnotationCursor({ visible: false });
        spotlightEnabled = false;
        updateSpotlightScreen({
          ...standalonePointerPosition,
          size: 14,
          visible: false
        });
      };
      const viewerHelpDialog = document.querySelector('#neopresent-viewer-help');
      const viewerHelpStatus = document.querySelector('#neopresent-viewer-help-status');
      const viewerHelpDescription = document.querySelector(
        '#neopresent-viewer-help-description'
      );
      const viewerHelpGrid = document.querySelector('#neopresent-viewer-help-grid');
      const viewerHelpCard = document.querySelector('#neopresent-viewer-help-card');
      const viewerHelpChannel = new BroadcastChannel('neopresent-viewer-help');
      let viewerHelpOpen = false;
      let viewerHelpRefreshTimer;
      const viewerCommonShortcuts = [
        ['← / →', 'Previous / next slide or reveal'],
        ['Home / End', 'First / last slide'],
        ['O', 'Open or cycle overview modes'],
        ['Enter / 0', 'Select a focused overview slide / exit overview'],
        ['N', 'Toggle speaker notes'],
        ['C', 'Toggle the viewer control bar'],
        ['P', 'Toggle PDF inspection mode'],
        ['F', 'Enter or leave fullscreen'],
        ['H / ?', 'Show or hide this help']
      ];
      const viewerStandaloneShortcuts = [
        ['Space', 'Pause or resume slide animations'],
        ['Z', 'Toggle the liquid-glass magnifier'],
        ['T / V', 'Toggle table of contents / filmstrip'],
        ['L / S', 'Toggle laser / spotlight'],
        ['A / E', 'Toggle annotation / annotation eraser'],
        ['B', 'Blank or resume the screen']
      ];
      const renderViewerHelp = () => {
        const connected = presenterIsOpen();
        viewerHelpStatus.textContent = connected ? 'Presenter connected' : 'Standalone viewer';
        viewerHelpDescription.textContent = connected
          ? 'Navigation and viewing shortcuts remain available here. Animation, ink, laser, spotlight, blanking, TOC, and filmstrip controls are owned by the presenter window.'
          : 'The viewer is controlling the presentation directly, including animation and presentation tools.';
        const shortcuts = connected
          ? viewerCommonShortcuts
          : [...viewerCommonShortcuts, ...viewerStandaloneShortcuts];
        viewerHelpGrid.replaceChildren(
          ...shortcuts.flatMap(([key, description]) => {
            const keyElement = document.createElement('kbd');
            keyElement.textContent = key;
            const descriptionElement = document.createElement('span');
            descriptionElement.textContent = description;
            return [keyElement, descriptionElement];
          })
        );
      };
      const setViewerHelpOpen = (open) => {
        viewerHelpOpen = open;
        clearInterval(viewerHelpRefreshTimer);
        if (open) renderViewerHelp();
        viewerHelpDialog.hidden = !open;
        viewerHelpDialog.setAttribute('aria-hidden', String(!open));
        if (open) {
          viewerHelpCard.focus({ preventScroll: true });
          viewerHelpRefreshTimer = setInterval(renderViewerHelp, 1000);
        }
      };
      viewerHelpChannel.onmessage = (event) => {
        if (event.data?.type === 'toggle') setViewerHelpOpen(!viewerHelpOpen);
      };
      viewerHelpDialog.addEventListener('click', (event) => {
        if (event.target === viewerHelpDialog) setViewerHelpOpen(false);
      });
      document.addEventListener(
        'keydown',
        (event) => {
          const editable =
            event.target instanceof HTMLElement &&
            event.target.closest('input, textarea, [contenteditable="true"]');
          if (editable || event.metaKey || event.ctrlKey || event.altKey || event.repeat) return;
          const helpShortcut = event.key === '?' || event.key.toLowerCase() === 'h';
          if (!helpShortcut && !(event.key === 'Escape' && viewerHelpOpen)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          setViewerHelpOpen(helpShortcut ? !viewerHelpOpen : false);
        },
        true
      );

      document.addEventListener(
        'pointermove',
        (event) => {
          updateStandalonePointer(event);
          if (standaloneAnnotationEraserEnabled && event.buttons === 1) {
            const point = standalonePointerPoint(event);
            if (point) eraseAudienceAnnotationAt(point);
            return;
          }
          if (!standaloneAnnotationEnabled || !activeAnnotationPath) return;
          const point = standalonePointerPoint(event);
          if (!point) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          activeAnnotationPath.points.push(point);
          renderAudienceAnnotations();
        },
        true
      );

      document.addEventListener(
        'pointerdown',
        (event) => {
          if (
            (!standaloneAnnotationEnabled && !standaloneAnnotationEraserEnabled) ||
            event.button !== 0
          )
            return;
          const point = standalonePointerPoint(event);
          if (!point) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          if (standaloneAnnotationEraserEnabled) {
            eraseAudienceAnnotationAt(point);
            return;
          }
          activeAnnotationPath = {
            color: '#ff3b30',
            points: [point],
            stroke: 'chalk',
            width: 0.008
          };
          annotationPaths = annotationsBySlide.get(audienceSlideIndex) || [];
          annotationPaths.push(activeAnnotationPath);
          annotationsBySlide.set(audienceSlideIndex, annotationPaths);
          renderAudienceAnnotations();
        },
        true
      );

      const finishStandaloneAnnotation = () => {
        activeAnnotationPath = undefined;
      };
      document.addEventListener('pointerup', finishStandaloneAnnotation, true);
      document.addEventListener('pointercancel', finishStandaloneAnnotation, true);

      let audienceAnimationsPaused = false;
      const pausedAudienceAnimations = new Set();
      const isAudienceSlideAnimation = (animation) => {
        const target = animation.effect?.target;
        return target instanceof Element && Boolean(target.closest('[data-neopresent-slide-host]'));
      };
      const pauseAudienceAnimations = () => {
        document.getAnimations().forEach((animation) => {
          if (!isAudienceSlideAnimation(animation)) return;
          if (!['pending', 'running'].includes(animation.playState)) return;
          animation.pause();
          pausedAudienceAnimations.add(animation);
        });
      };
      const keepAudienceAnimationsPaused = (framesRemaining = 8) => {
        pauseAudienceAnimations();
        if (!audienceAnimationsPaused || framesRemaining <= 0) return;
        requestAnimationFrame(() => keepAudienceAnimationsPaused(framesRemaining - 1));
      };
      const setAudienceAnimationsPaused = (paused) => {
        if (audienceAnimationsPaused === paused) return;
        audienceAnimationsPaused = paused;
        if (paused) {
          keepAudienceAnimationsPaused();
          return;
        }
        pausedAudienceAnimations.forEach((animation) => {
          if (animation.playState === 'paused') animation.play();
        });
        pausedAudienceAnimations.clear();
      };
      const toggleAudienceAnimations = () => setAudienceAnimationsPaused(!audienceAnimationsPaused);
      new MutationObserver(() => {
        if (audienceAnimationsPaused) requestAnimationFrame(() => keepAudienceAnimationsPaused());
      }).observe(document.documentElement, {
        attributeFilter: ['class', 'style'],
        attributes: true,
        childList: true,
        subtree: true
      });

      document.addEventListener(
        'keydown',
        (event) => {
          const editable =
            event.target instanceof HTMLElement &&
            event.target.closest('input, textarea, [contenteditable="true"]');
          if (editable || event.metaKey || event.ctrlKey || event.altKey || event.repeat) return;
          const key = event.key.toLowerCase();
          if (presenterIsOpen()) return;
          if (![' ', 'a', 'b', 'e', 'l', 's', 'z'].includes(key)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          if (key === ' ') {
            toggleAudienceAnimations();
            return;
          }
          if (key === 'z') {
            standaloneMagnifierEnabled = !standaloneMagnifierEnabled;
            updateMagnifier({
              ...standalonePointerPosition,
              visible: standaloneMagnifierEnabled
            });
            return;
          }
          if (key === 'b') {
            standaloneAudienceBlanked = !standaloneAudienceBlanked;
            updateBlackoutScreen(standaloneAudienceBlanked);
          }
          if (key === 'l') {
            standaloneLaserEnabled = !standaloneLaserEnabled;
            if (standaloneLaserEnabled) {
              standaloneAnnotationEnabled = false;
              standaloneAnnotationEraserEnabled = false;
              activeAnnotationPath = undefined;
            }
            updateLaserPointer({
              ...standalonePointerPosition,
              symbol: '',
              visible: standaloneLaserEnabled
            });
          }
          if (key === 's') {
            standaloneSpotlightEnabled = !standaloneSpotlightEnabled;
            spotlightEnabled = standaloneSpotlightEnabled;
            updateSpotlightScreen({
              ...standalonePointerPosition,
              size: 14,
              visible: standaloneSpotlightEnabled
            });
          }
          if (key === 'a') {
            standaloneAnnotationEnabled = !standaloneAnnotationEnabled;
            activeAnnotationPath = undefined;
            if (standaloneAnnotationEnabled && standaloneLaserEnabled) {
              standaloneLaserEnabled = false;
              updateLaserPointer({ visible: false });
            }
            updateAnnotationCursor({
              ...standalonePointerPosition,
              symbol: standaloneAnnotationEraserEnabled ? '⌫' : '✍',
              color: standaloneAnnotationEraserEnabled ? '#f8fafc' : '#ff3b30',
              visible: standaloneAnnotationEnabled || standaloneAnnotationEraserEnabled
            });
          }
          if (key === 'e') {
            standaloneAnnotationEraserEnabled = !standaloneAnnotationEraserEnabled;
            activeAnnotationPath = undefined;
            if (standaloneAnnotationEraserEnabled && standaloneLaserEnabled) {
              standaloneLaserEnabled = false;
              updateLaserPointer({ visible: false });
            }
            updateAnnotationCursor({
              ...standalonePointerPosition,
              symbol: standaloneAnnotationEraserEnabled ? '⌫' : '✍',
              color: standaloneAnnotationEraserEnabled ? '#f8fafc' : '#ff3b30',
              visible: standaloneAnnotationEnabled || standaloneAnnotationEraserEnabled
            });
          }
        },
        true
      );

      const applyViewerTocFocus = (index) => {
        const focusedIndex = index == null ? Number.NaN : Number(index);
        document
          .querySelectorAll(".neopresent-toc-panel a[href^='#slide=']")
          .forEach((entry) =>
            entry.classList.toggle(
              'neopresent-toc-focus',
              Number.isInteger(focusedIndex) &&
                entry.getAttribute('href') === `#slide=${focusedIndex + 1}`
            )
          );
      };
      const standaloneTocEntry = (target) =>
        target instanceof Element
          ? target.closest(".neopresent-toc-panel a[href^='#slide=']")
          : null;
      document.addEventListener(
        'mouseover',
        (event) => {
          if (presenterIsOpen()) return;
          const entry = standaloneTocEntry(event.target);
          if (!entry || entry === standaloneTocEntry(event.relatedTarget)) return;
          const index = Number(entry.getAttribute('href')?.match(/#slide=(\d+)/)?.[1]) - 1;
          applyViewerTocFocus(index);
        },
        true
      );
      document.addEventListener(
        'mouseout',
        (event) => {
          if (presenterIsOpen()) return;
          const entry = standaloneTocEntry(event.target);
          if (!entry || entry === standaloneTocEntry(event.relatedTarget)) return;
          applyViewerTocFocus(null);
        },
        true
      );

      const publishPdfControlState = () => {
        const root = document.querySelector('[data-neopresent-pdf-inspection="true"]');
        if (!root) {
          presenterStateChannel.postMessage({ type: 'pdf-control-state', active: false });
          return;
        }
        const hosts = [...root.querySelectorAll('[data-pdf-viewer-host="true"]')];
        const rootTop = root.getBoundingClientRect().top;
        const pdfIndex = hosts.reduce(
          (best, host, index) => {
            const distance = Math.abs(host.getBoundingClientRect().top - rootTop);
            return distance < best.distance ? { distance, index } : best;
          },
          { distance: Number.POSITIVE_INFINITY, index: 0 }
        ).index;
        presenterStateChannel.postMessage({
          type: 'pdf-control-state',
          active: true,
          pdfCount: hosts.length,
          pdfIndex,
          zoom: Number(root.dataset.neopresentPdfZoom || 1)
        });
      };
      const applyPdfControl = (action) => {
        const root = document.querySelector('[data-neopresent-pdf-inspection="true"]');
        if (!root) {
          publishPdfControlState();
          return;
        }
        const hosts = [...root.querySelectorAll('[data-pdf-viewer-host="true"]')];
        const currentZoom = Number(root.dataset.neopresentPdfZoom || 1);
        if (action === 'zoom-in' || action === 'zoom-out' || action === 'fit') {
          const zoom =
            action === 'fit'
              ? 1
              : Math.max(
                  0.75,
                  Math.min(3, currentZoom + (action === 'zoom-in' ? 0.25 : -0.25))
                );
          root.dataset.neopresentPdfZoom = String(zoom);
          hosts.forEach((host) => {
            host.dataset.pdfViewerZoom = String(zoom);
            host.style.width = `${zoom * 100}%`;
            delete host.dataset.pdfViewerObservedWidth;
          });
          if (action === 'fit') root.scrollTo({ behavior: 'smooth', left: 0, top: 0 });
        } else if (action === 'scroll-up' || action === 'scroll-down') {
          root.scrollBy({
            behavior: 'smooth',
            top: root.clientHeight * (action === 'scroll-down' ? 0.72 : -0.72)
          });
        } else if (action === 'scroll-left' || action === 'scroll-right') {
          root.scrollBy({
            behavior: 'smooth',
            left: root.clientWidth * (action === 'scroll-right' ? 0.42 : -0.42)
          });
        } else if (action === 'previous-pdf' || action === 'next-pdf') {
          if (hosts.length > 0) {
            const rootTop = root.getBoundingClientRect().top;
            const currentIndex = hosts.reduce(
              (best, host, index) => {
                const distance = Math.abs(host.getBoundingClientRect().top - rootTop);
                return distance < best.distance ? { distance, index } : best;
              },
              { distance: Number.POSITIVE_INFINITY, index: 0 }
            ).index;
            const nextIndex = Math.max(
              0,
              Math.min(hosts.length - 1, currentIndex + (action === 'next-pdf' ? 1 : -1))
            );
            const targetTop =
              root.scrollTop +
              hosts[nextIndex].getBoundingClientRect().top -
              root.getBoundingClientRect().top;
            root.scrollTo({ behavior: 'smooth', left: root.scrollLeft, top: targetTop });
          }
        }
        requestAnimationFrame(() => requestAnimationFrame(publishPdfControlState));
        setTimeout(publishPdfControlState, 420);
      };

      presenterStateChannel.onmessage = (event) => {
        if (event.data?.type === 'pdf-control') {
          if (event.data.action === 'state') publishPdfControlState();
          else applyPdfControl(event.data.action);
          return;
        }
        if (event.data?.type === 'presenter-preview-ready') {
          if (audienceAwaitingPresenterPreview) {
            audienceAwaitingPresenterPreview = false;
            clearTimeout(audienceAnimationGateTimer);
            document.documentElement.classList.remove('neopresent-paired-reload-hold');
          }
          return;
        }
        if (event.data?.type === 'presenter-window-refreshed') {
          try {
            sessionStorage.setItem(pairedReloadStorageKey, 'presenter');
            window.location.reload();
          } catch {
            // Do not interrupt a presentation if browser storage is unavailable.
          }
          return;
        }
        if (event.data?.type === 'toc-focus') {
          applyViewerTocFocus(event.data.index);
          return;
        }
        if (event.data?.type === 'filmstrip-theme-swap') {
          if (event.data.phase === 'start') {
            document
              .querySelectorAll('.neopresent-filmstrip-snapshot')
              .forEach((snapshot) => snapshot.remove());
            const panel = document.querySelector('.neopresent-filmstrip-panel');
            if (panel) {
              filmstripThemeSnapshot = panel.cloneNode(true);
              filmstripThemeSnapshot.classList.remove('neopresent-filmstrip-panel');
              filmstripThemeSnapshot.classList.add('neopresent-filmstrip-snapshot');
              [
                filmstripThemeSnapshot,
                ...filmstripThemeSnapshot.querySelectorAll('[id], [data-neo-id]')
              ].forEach((node) => {
                node.removeAttribute('id');
                node.removeAttribute('data-neo-id');
              });
              document.body.append(filmstripThemeSnapshot);
              const sourceScroller = panel.querySelector('[data-neopresent-filmstrip]');
              const snapshotScroller = filmstripThemeSnapshot.querySelector(
                '[data-neopresent-filmstrip]'
              );
              if (sourceScroller && snapshotScroller) {
                snapshotScroller.scrollLeft = sourceScroller.scrollLeft;
              }
            }
          } else if (event.data.phase === 'end' && filmstripThemeSnapshot) {
            const snapshot = filmstripThemeSnapshot;
            requestAnimationFrame(() => {
              snapshot.style.opacity = '0';
              setTimeout(() => {
                snapshot.remove();
                if (filmstripThemeSnapshot === snapshot) {
                  filmstripThemeSnapshot = undefined;
                }
              }, 160);
            });
          }
          return;
        }
        if (event.data?.type === 'request-state') {
          notePresenterPresence();
          if (event.data.refresh === true) {
            // A freshly reloaded presenter did not receive the previous one-time
            // ready signal. Re-send it once; ordinary status polling must not
            // restart or seek the live animations.
            lastReadyAudienceSlideIndex = -1;
            scheduleUniformSlideScale();
          }
        }
        if (event.data?.type === 'filmstrip-scroll') {
          presenterFilmstripScrollRatio = Math.max(0, Math.min(1, Number(event.data.ratio) || 0));
          applyPresenterFilmstripScroll();
        }
        if (event.data?.type === 'laser-font') loadLaserFont(event.data);
        if (event.data?.type === 'laser') {
          updateLaserPointer(event.data);
        }
        if (event.data?.type === 'magnifier') {
          updateMagnifier(event.data);
        }
        if (event.data?.type === 'annotation-cursor') updateAnnotationCursor(event.data);
        if (event.data?.type === 'chart-tooltip') updatePresenterChartTooltip(event.data);
        if (event.data?.type === 'blackout') updateBlackoutScreen(event.data.visible);
        if (event.data?.type === 'spotlight') {
          spotlightEnabled = Boolean(event.data.visible);
          updateSpotlightScreen({ ...event.data, visible: spotlightEnabled });
        }
        if (event.data?.type === 'spotlight-ring-style') applySpotlightRingStyle(event.data);
        if (event.data?.type === 'state' && Number.isInteger(event.data.activeIndex)) {
          const wasAudienceOverview = audienceOverviewActive;
          audienceOverviewActive = event.data.overview === true;
          const exitedAudienceOverview = wasAudienceOverview && !audienceOverviewActive;
          const themeProperties = {
            accent: '--np-accent',
            background: '--np-background',
            border: '--np-border',
            foreground: '--np-foreground',
            muted: '--np-muted',
            panel: '--np-panel',
            surface: '--np-surface'
          };
          Object.entries(themeProperties).forEach(([key, property]) => {
            const value = event.data.theme?.[key];
            if (typeof value === 'string')
              document.documentElement.style.setProperty(property, value);
          });
          const panelColor = String(event.data.theme?.panel || '#ffffff');
          const surfaceColor = String(event.data.theme?.surface || panelColor);
          const contrastColor = isDarkThemeColor(panelColor) ? 'white' : 'black';
          document.documentElement.style.setProperty(
            '--np-controls-panel',
            `color-mix(in srgb, ${panelColor} 86%, ${contrastColor})`
          );
          document.documentElement.style.setProperty(
            '--np-controls-surface',
            `color-mix(in srgb, ${surfaceColor} 90%, ${contrastColor})`
          );
          audienceAspect = String(event.data.liveAspect || event.data.currentSlide?.aspect || '');
          document.documentElement.classList.toggle(
            'neopresent-filmstrip-open',
            Boolean(event.data.filmstripOpen)
          );
          document.documentElement.classList.toggle(
            'neopresent-toc-open',
            Boolean(event.data.tocOpen)
          );
          document.querySelectorAll(".neopresent-toc-panel a[href^='#slide=']").forEach((entry) => {
            entry.classList.toggle(
              'neopresent-toc-current',
              entry.getAttribute('href') === `#slide=${event.data.activeIndex + 1}`
            );
          });
          updateProgressIndicator(event.data);
          if (audienceSlideIndex !== event.data.activeIndex || exitedAudienceOverview) {
            if (audienceSlideIndex !== event.data.activeIndex) setAudienceAnimationsPaused(false);
            audienceSlideIndex = event.data.activeIndex;
            if (exitedAudienceOverview) {
              // The audience slide is freshly mounted when overview closes.
              // Hold it at its first frame until the presenter preview has
              // been rebuilt from the same state.
              audienceAwaitingPresenterPreview = true;
              document.documentElement.classList.add('neopresent-paired-reload-hold');
              clearTimeout(audienceAnimationGateTimer);
              audienceAnimationGateTimer = setTimeout(() => {
                if (!audienceAwaitingPresenterPreview) return;
                audienceAwaitingPresenterPreview = false;
                document.documentElement.classList.remove('neopresent-paired-reload-hold');
              }, 180);
              lastReadyAudienceSlideIndex = -1;
            }
            scheduleUniformSlideScale();
            if (latestMagnifierPointer.visible) {
              requestAnimationFrame(() => updateMagnifier(latestMagnifierPointer));
            }
            annotationPaths = annotationsBySlide.get(audienceSlideIndex) || [];
            activeAnnotationPath = undefined;
            renderAudienceAnnotations();
          }
        }
        if (event.data?.type === 'annotation-clear')
          clearAudienceAnnotations(event.data.slideIndex);
        if (event.data?.type === 'annotation-erase' && event.data.point)
          eraseAudienceAnnotationAt(event.data.point, event.data.radius, event.data.slideIndex);
        if (event.data?.type === 'annotation-undo') {
          const slideIndex = Number.isInteger(event.data.slideIndex)
            ? event.data.slideIndex
            : audienceSlideIndex;
          const paths = annotationsBySlide.get(slideIndex) || [];
          paths.pop();
          annotationsBySlide.set(slideIndex, paths);
          if (slideIndex === audienceSlideIndex) {
            annotationPaths = paths;
            renderAudienceAnnotations();
          }
        }
        if (event.data?.type === 'annotation-redo' && event.data.path) {
          const slideIndex = Number.isInteger(event.data.slideIndex)
            ? event.data.slideIndex
            : audienceSlideIndex;
          const paths = annotationsBySlide.get(slideIndex) || [];
          paths.push(event.data.path);
          annotationsBySlide.set(slideIndex, paths);
          if (slideIndex === audienceSlideIndex) {
            annotationPaths = paths;
            renderAudienceAnnotations();
          }
        }
        if (event.data?.type === 'annotation-start') {
          const slideIndex = Number.isInteger(event.data.slideIndex)
            ? event.data.slideIndex
            : audienceSlideIndex;
          activeAnnotationPath = {
            color: event.data.color || '#ff3b30',
            points: [event.data.point],
            stroke: event.data.stroke || 'chalk',
            width: Number.isFinite(event.data.width) ? event.data.width : 0.008
          };
          const paths = annotationsBySlide.get(slideIndex) || [];
          paths.push(activeAnnotationPath);
          annotationsBySlide.set(slideIndex, paths);
          if (slideIndex === audienceSlideIndex) {
            annotationPaths = paths;
            renderAudienceAnnotations();
          }
        }
        if (event.data?.type === 'annotation-point' && activeAnnotationPath) {
          activeAnnotationPath.points.push(event.data.point);
          renderAudienceAnnotations();
        }
      };
      spotlightChannel.onmessage = (event) => {
        spotlightEnabled = Boolean(event.data?.visible);
        updateSpotlightScreen({ ...event.data, visible: spotlightEnabled });
        if (event.data?.laser) updateLaserPointer({ ...event.data, visible: spotlightEnabled });
      };
      spotlightRingChannel.onmessage = (event) => {
        applySpotlightRingStyle(event.data);
      };
      presenterStateChannel.postMessage({ type: 'request-laser-font' });
      // Neo routes keyboard events through the focused component. A presentation
      // should still navigate when the browser body has focus (the normal case
      // immediately after loading), so forward presentation keys to the viewport.
      const presentationKeys = new Set([
        'ArrowRight',
        'ArrowDown',
        'PageDown',
        'ArrowLeft',
        'ArrowUp',
        'PageUp',
        'Home',
        'End',
        'Enter',
        'Escape',
        '0',
        'n',
        'N',
        't',
        'T',
        'v',
        'V',
        'c',
        'C',
        'o',
        'O',
        'p',
        'P'
      ]);

      document.addEventListener(
        'keydown',
        (event) => {
          const target = event.target;
          const isEditable =
            target instanceof HTMLElement &&
            target.closest('input, textarea, [contenteditable="true"]');
          const viewport = document.querySelector('.neo-viewport');

          if (isEditable) {
            return;
          }

          if (event.key === 'Escape' && document.fullscreenElement && audienceOverviewActive) {
            // Browsers reserve Escape to leave fullscreen even when the event
            // is cancelled. Restore fullscreen after Neo closes the overview.
            restoreFullscreenAfterOverviewEscape = true;
          }

          const panelShortcut = ['t', 'v'].includes(event.key.toLowerCase());
          if (panelShortcut && event.isTrusted && presenterIsOpen()) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return;
          }

          if (!presentationKeys.has(event.key) || !viewport) return;

          // Suppress browser defaults even when Neo already owns the focused
          // element. The component key handler below will still receive it.
          if (viewport.contains(target)) {
            event.preventDefault();
            return;
          }

          event.preventDefault();
          viewport.dispatchEvent(
            new KeyboardEvent('keydown', {
              bubbles: true,
              cancelable: true,
              key: event.key
            })
          );
        },
        { capture: true }
      );

      // Overview previews are created by Neo in its worker. Hover effects are
      // deliberately applied here in the browser, so they remain fluid and do
      // not require a worker re-render for every pointer movement.
      const getOverviewCard = (target) =>
        target instanceof Element ? target.closest('[data-neopresent-overview-card]') : null;

      document.addEventListener(
        'pointerover',
        (event) => {
          const card = getOverviewCard(event.target);
          const from = getOverviewCard(event.relatedTarget);
          if (!card || card === from) return;

          card.dataset.neopresentBaseTransform = card.style.transform;
          card.dataset.neopresentBaseShadow = card.style.boxShadow;
          const overview = card.closest('[data-neopresent-overview]');
          if (
            overview?.dataset.neopresentOverview === 'gallery' ||
            overview?.dataset.neopresentOverview === 'helix'
          )
            return;
          card.style.transform = `${card.style.transform || ''} translateY(-7px) scale(1.035) rotate(-.35deg)`;
          card.style.boxShadow = '0 20px 42px rgba(0,0,0,.42), 0 0 0 3px rgba(125,211,252,.72)';
          card.style.zIndex = '2';
        },
        true
      );

      document.addEventListener(
        'pointerout',
        (event) => {
          const card = getOverviewCard(event.target);
          const to = getOverviewCard(event.relatedTarget);
          if (!card || card === to) return;
          if (
            card.closest('[data-neopresent-overview="gallery"], [data-neopresent-overview="helix"]')
          )
            return;

          card.style.transform = card.dataset.neopresentBaseTransform || '';
          card.style.boxShadow = card.dataset.neopresentBaseShadow || '';
          card.style.zIndex = '';
        },
        true
      );

      const galleryAnimationSettings = {
        cameraReturnDuration: 5000,
        cameraTurnDuration: 330,
        cameraEasing: 'cubic-bezier(.2,.6,.6,.9)'
      };
      const galleryGestureState = { x: 0, z: 0 };
      const applyGalleryGesture = (camera) => {
        if (!camera) return;
        camera.style.translate = `${galleryGestureState.x}px 0 ${galleryGestureState.z}px`;
        camera.style.scale = '';
      };
      document.addEventListener(
        'wheel',
        (event) => {
          if (event.ctrlKey) return;
          const gallery =
            event.target instanceof Element
              ? event.target.closest('[data-neopresent-overview="gallery"]')
              : null;
          if (!gallery) return;
          const camera = gallery.querySelector('[data-neopresent-gallery-camera]');
          if (!camera) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          galleryGestureState.x = Math.max(
            -5000,
            Math.min(5000, galleryGestureState.x - event.deltaX * 10)
          );
          galleryGestureState.z = Math.max(
            -1600,
            Math.min(420, galleryGestureState.z + event.deltaY * 10)
          );
          applyGalleryGesture(camera);
        },
        { capture: true, passive: false }
      );
      const helixGestureState = { rotation: 0, z: 0 };
      const applyHelixGesture = (group) => {
        if (!group) return;
        group.style.transform = `translateZ(${helixGestureState.z}px) rotateY(${helixGestureState.rotation}deg)`;
      };
      document.addEventListener(
        'wheel',
        (event) => {
          if (event.ctrlKey) return;
          const helix =
            event.target instanceof Element
              ? event.target.closest('[data-neopresent-overview="helix"]')
              : null;
          if (!helix) return;
          const group = helix.querySelector('[data-neopresent-helix-group]');
          if (!group) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          helixGestureState.rotation += event.deltaX * 5;
          helixGestureState.z += event.deltaY * 50;
          applyHelixGesture(group);
        },
        { capture: true, passive: false }
      );
      const playGalleryCameraRotation = (camera) => {
        applyGalleryGesture(camera);
        const key = camera.dataset.neopresentGalleryCamera;
        const direction = Number(camera.dataset.neopresentGalleryRotation);
        if (!key || camera.dataset.neopresentGalleryPlayed === key || direction === 0) return;
        camera.dataset.neopresentGalleryPlayed = key;
        const currentTransform = getComputedStyle(camera).transform;
        camera.getAnimations().forEach((animation) => animation.cancel());
        const turn = camera.animate(
          [
            { transform: currentTransform === 'none' ? 'rotateY(0deg)' : currentTransform },
            { transform: `rotateY(${direction * 45}deg)` }
          ],
          {
            duration: galleryAnimationSettings.cameraTurnDuration,
            easing: galleryAnimationSettings.cameraEasing,
            fill: 'forwards'
          }
        );
        turn.finished
          .then(() => {
            if (!camera.isConnected || camera.dataset.neopresentGalleryPlayed !== key) return;
            camera.animate(
              [{ transform: `rotateY(${direction * 45}deg)` }, { transform: 'rotateY(0deg)' }],
              {
                duration: galleryAnimationSettings.cameraReturnDuration,
                easing: galleryAnimationSettings.cameraEasing,
                fill: 'forwards'
              }
            );
          })
          .catch(() => {});
      };
      const galleryCameraObserver = new MutationObserver((mutations) => {
        const galleryChanged = mutations.some((mutation) => {
          if (
            mutation.type === 'attributes' &&
            mutation.target instanceof Element &&
            mutation.target.matches('[data-neopresent-gallery-camera]')
          )
            return true;
          return [...mutation.addedNodes].some(
            (node) =>
              node instanceof Element &&
              (node.matches('[data-neopresent-gallery-camera]') ||
                node.querySelector('[data-neopresent-gallery-camera]'))
          );
        });
        const helixChanged = mutations.some((mutation) => {
          if (
            mutation.type === 'attributes' &&
            mutation.target instanceof Element &&
            mutation.target.matches('[data-neopresent-helix-group]')
          )
            return true;
          return [...mutation.addedNodes].some(
            (node) =>
              node instanceof Element &&
              (node.matches('[data-neopresent-helix-group]') ||
                node.querySelector('[data-neopresent-helix-group]'))
          );
        });
        if (galleryChanged)
          document
            .querySelectorAll('[data-neopresent-gallery-camera]')
            .forEach(playGalleryCameraRotation);
        if (helixChanged)
          document.querySelectorAll('[data-neopresent-helix-group]').forEach(applyHelixGesture);
      });
      galleryCameraObserver.observe(document.body, {
        attributeFilter: [
          'data-neopresent-gallery-camera',
          'data-neopresent-gallery-rotation',
          'data-neopresent-helix-group'
        ],
        attributes: true,
        childList: true,
        subtree: true
      });

      // SVG <title> elements are not consistently readable on touchpads and
      // may be delayed by the browser. NeoPresent data marks provide their
      // values through this immediate, pointer-following tooltip instead.
      let chartTooltip;
      const getChartMark = (target) =>
        target instanceof Element ? target.closest('[data-neopresent-tooltip]') : null;
      const positionChartTooltip = (event) => {
        if (!chartTooltip) return;
        chartTooltip.style.left = `${event.clientX + 10}px`;
        chartTooltip.style.top = `${event.clientY - 10}px`;
      };
      const emphasizeChartMark = (mark) => {
        const chart = mark.closest('svg');
        const isSurface = Boolean(mark.closest('[data-neopresent-surface]'));
        const isBar = mark.localName === 'rect' || mark.dataset.neopresentMarkKind === 'bar';
        const isBox = mark.dataset.neopresentMarkKind === 'box';
        mark.dataset.neopresentMarkTransform = mark.style.transform;
        mark.dataset.neopresentMarkFilter = mark.style.filter;
        Object.assign(mark.style, {
          cursor: 'pointer',
          filter: 'drop-shadow(0 0 7px rgba(250,204,21,.95))',
          // Bars expand from their baseline. Points use a larger, immediate
          // magnification: informative without a distracting fly-in/out.
          transform: isSurface
            ? 'none'
            : isBar
              ? 'scale(1.035, 1.08)'
              : isBox
                ? 'scale(1.045)'
                : 'scale(1.5)',
          transformBox: 'fill-box',
          transformOrigin: isBar ? 'center bottom' : 'center',
          transition:
            isBar || isBox
              ? 'transform 100ms ease-out, filter 100ms ease-out'
              : 'filter 80ms ease-out'
        });
        if (!chart) return;
        chart.dataset.neopresentChartTransform = chart.style.transform;
        Object.assign(chart.style, {
          filter: 'drop-shadow(0 8px 12px rgba(0,0,0,.24))',
          transformOrigin: 'center',
          transition: 'filter 140ms ease-out'
        });
      };
      const restoreChartMark = (mark) => {
        const chart = mark.closest('svg');
        mark.style.cursor = '';
        mark.style.filter = mark.dataset.neopresentMarkFilter || '';
        mark.style.transform = mark.dataset.neopresentMarkTransform || '';
        mark.style.transformBox = '';
        mark.style.transformOrigin = '';
        if (!chart) return;
        chart.style.filter = '';
        chart.style.transform = chart.dataset.neopresentChartTransform || '';
        chart.style.transformOrigin = '';
      };

      document.addEventListener(
        'pointerover',
        (event) => {
          const mark = getChartMark(event.target);
          const from = getChartMark(event.relatedTarget);
          if (!mark || mark === from) return;
          chartTooltip ??= document.createElement('div');
          Object.assign(chartTooltip.style, {
            background: 'rgba(8,15,31,.94)',
            border: '1px solid rgba(148,163,184,.8)',
            borderRadius: '.35rem',
            boxShadow: '0 6px 20px rgba(0,0,0,.35)',
            color: '#f8fafc',
            font: '600 .8rem/1.3 system-ui,sans-serif',
            maxWidth: '18rem',
            padding: '.35rem .5rem',
            pointerEvents: 'none',
            position: 'fixed',
            whiteSpace: 'pre-wrap',
            zIndex: '10000'
          });
          setMathAwareText(chartTooltip, mark.getAttribute('data-neopresent-tooltip') || '');
          document.body.append(chartTooltip);
          positionChartTooltip(event);
          emphasizeChartMark(mark);
        },
        true
      );

      document.addEventListener(
        'pointermove',
        (event) => {
          if (getChartMark(event.target)) positionChartTooltip(event);
        },
        true
      );

      document.addEventListener(
        'pointerout',
        (event) => {
          const mark = getChartMark(event.target);
          const to = getChartMark(event.relatedTarget);
          if (!mark || mark === to) return;
          chartTooltip?.remove();
          restoreChartMark(mark);
        },
        true
      );

      // Touch screens use a deliberate horizontal swipe to navigate. Vertical
      // movement is left untouched for scrolling an overview or embedded data.
      let touchStart;
      document.addEventListener(
        'touchstart',
        (event) => {
          const touch = event.touches[0];
          if (!touch || event.touches.length !== 1) return;
          touchStart = {
            x: touch.clientX,
            y: touch.clientY,
            filmstrip:
              event.target instanceof Element &&
              event.target.closest('[data-neopresent-filmstrip]'),
            lastX: touch.clientX
          };
        },
        { capture: true, passive: true }
      );

      document.addEventListener(
        'touchmove',
        (event) => {
          const touch = event.touches[0];
          if (!touchStart?.filmstrip || !touch || event.touches.length !== 1) return;
          event.preventDefault();
          touchStart.filmstrip.style.scrollBehavior = 'auto';
          touchStart.filmstrip.scrollLeft += (touchStart.lastX - touch.clientX) * 1.8;
          touchStart.lastX = touch.clientX;
        },
        { capture: true, passive: false }
      );

      document.addEventListener(
        'touchend',
        (event) => {
          const touch = event.changedTouches[0];
          const viewport = document.querySelector('.neo-viewport');
          if (!touchStart || !touch || !viewport) return;
          if (touchStart.filmstrip) {
            touchStart = undefined;
            return;
          }
          const deltaX = touch.clientX - touchStart.x;
          const deltaY = touch.clientY - touchStart.y;
          touchStart = undefined;
          if (Math.abs(deltaX) < 64 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
          event.preventDefault();
          viewport.dispatchEvent(
            new KeyboardEvent('keydown', {
              bubbles: true,
              cancelable: true,
              key: deltaX < 0 ? 'ArrowRight' : 'ArrowLeft'
            })
          );
        },
        { capture: true, passive: false }
      );

      // Trackpad pinch is reported as Ctrl+wheel by Chromium browsers. Safari
      // additionally exposes gesture events. Scale the app surface instead of
      // the browser UI, so the presentation can be inspected without leaving
      // its running session.
      let presentationZoom = 1;
      let gestureBaseZoom = 1;
      const zoomScrollSurface = document.createElement('div');
      zoomScrollSurface.className = 'neopresent-zoom-scroll-surface';
      document.body.append(zoomScrollSurface);
      const horizontalZoomScrollbar = document.createElement('input');
      horizontalZoomScrollbar.className =
        'neopresent-zoom-scrollbar neopresent-zoom-scrollbar-horizontal';
      horizontalZoomScrollbar.type = 'range';
      horizontalZoomScrollbar.min = '0';
      horizontalZoomScrollbar.step = '1';
      const verticalZoomScrollbar = document.createElement('input');
      verticalZoomScrollbar.className =
        'neopresent-zoom-scrollbar neopresent-zoom-scrollbar-vertical';
      verticalZoomScrollbar.type = 'range';
      verticalZoomScrollbar.min = '0';
      verticalZoomScrollbar.step = '1';
      document.body.append(horizontalZoomScrollbar, verticalZoomScrollbar);
      const applyZoomPan = () => {
        const viewport = document.querySelector('.neo-viewport');
        if (!viewport || presentationZoom <= 1.001) return;
        viewport.style.transform = `translate(${-Number(horizontalZoomScrollbar.value)}px, ${-Number(verticalZoomScrollbar.value)}px) scale(${presentationZoom})`;
        viewport.style.transformOrigin = 'top left';
      };
      const refreshZoomScrollbars = (center = false) => {
        const isZoomed = presentationZoom > 1.001;
        const maximumX = Math.max(0, Math.round(window.innerWidth * (presentationZoom - 1)));
        const maximumY = Math.max(0, Math.round(window.innerHeight * (presentationZoom - 1)));
        horizontalZoomScrollbar.max = String(maximumX);
        verticalZoomScrollbar.max = String(maximumY);
        horizontalZoomScrollbar.value = String(
          center ? maximumX / 2 : Math.min(maximumX, Number(horizontalZoomScrollbar.value))
        );
        verticalZoomScrollbar.value = String(
          center ? maximumY / 2 : Math.min(maximumY, Number(verticalZoomScrollbar.value))
        );
        horizontalZoomScrollbar.style.display = isZoomed ? 'block' : 'none';
        verticalZoomScrollbar.style.display = isZoomed ? 'block' : 'none';
        applyZoomPan();
      };
      horizontalZoomScrollbar.addEventListener('input', applyZoomPan);
      verticalZoomScrollbar.addEventListener('input', applyZoomPan);
      const setPresentationZoom = (value) => {
        const wasZoomed = presentationZoom > 1.001;
        presentationZoom = Math.max(0.5, Math.min(2.5, value));
        const isZoomed = presentationZoom > 1.001;
        const viewport = document.querySelector('.neo-viewport');
        document.documentElement.style.zoom = String(isZoomed ? 1 : presentationZoom);
        document.documentElement.dataset.neopresentZoom = String(
          Math.round(presentationZoom * 100)
        );
        document.documentElement.dataset.neopresentZoomed = String(isZoomed);
        zoomScrollSurface.style.display = isZoomed ? 'block' : 'none';
        zoomScrollSurface.style.height = isZoomed ? `${presentationZoom * 100}vh` : '0';
        zoomScrollSurface.style.width = isZoomed ? `${presentationZoom * 100}vw` : '0';
        if (viewport) {
          viewport.style.transform = isZoomed ? `scale(${presentationZoom})` : '';
          viewport.style.transformOrigin = isZoomed ? 'top left' : '';
        }
        if (!isZoomed) {
          horizontalZoomScrollbar.value = '0';
          verticalZoomScrollbar.value = '0';
        }
        refreshZoomScrollbars(isZoomed && !wasZoomed);
        requestAnimationFrame(() => {
          if (!isZoomed) {
            window.scrollTo(0, 0);
            return;
          }
          if (!wasZoomed) {
            const root = document.documentElement;
            window.scrollTo(
              Math.max(0, (root.scrollWidth - window.innerWidth) / 2),
              Math.max(0, (root.scrollHeight - window.innerHeight) / 2)
            );
          }
        });
      };

      window.addEventListener('resize', refreshZoomScrollbars);
      window.addEventListener(
        'wheel',
        (event) => {
          const filmstrip = document.querySelector('[data-neopresent-filmstrip]');
          if (!filmstrip || event.ctrlKey) return;
          const bounds = filmstrip.getBoundingClientRect();
          const insideFilmstrip =
            event.clientX >= bounds.left &&
            event.clientX <= bounds.right &&
            event.clientY >= bounds.top &&
            event.clientY <= bounds.bottom;
          if (!insideFilmstrip) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          const unit = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? 18 : 1;
          const delta =
            Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
          filmstrip.style.scrollBehavior = 'auto';
          filmstrip.scrollBy({
            left: delta * unit * 1.8,
            behavior: 'auto'
          });
        },
        { capture: true, passive: false }
      );
      window.addEventListener(
        'wheel',
        (event) => {
          if (event.ctrlKey || presentationZoom <= 1.001) return;
          const target = event.target;
          if (
            target === horizontalZoomScrollbar ||
            target === verticalZoomScrollbar ||
            (target instanceof Element &&
              target.closest('[data-neopresent-overview], [data-neopresent-filmstrip]'))
          )
            return;
          event.preventDefault();
          horizontalZoomScrollbar.value = String(
            Math.max(
              0,
              Math.min(
                Number(horizontalZoomScrollbar.max),
                Number(horizontalZoomScrollbar.value) + event.deltaX
              )
            )
          );
          verticalZoomScrollbar.value = String(
            Math.max(
              0,
              Math.min(
                Number(verticalZoomScrollbar.max),
                Number(verticalZoomScrollbar.value) + event.deltaY
              )
            )
          );
          applyZoomPan();
        },
        { capture: true, passive: false }
      );

      window.addEventListener(
        'wheel',
        (event) => {
          if (!event.ctrlKey) return;
          event.preventDefault();
          setPresentationZoom(presentationZoom * Math.exp(-event.deltaY * 0.0015));
        },
        { capture: true, passive: false }
      );

      window.addEventListener(
        'gesturestart',
        (event) => {
          gestureBaseZoom = presentationZoom;
          event.preventDefault();
        },
        { capture: true, passive: false }
      );

      window.addEventListener(
        'gesturechange',
        (event) => {
          event.preventDefault();
          setPresentationZoom(gestureBaseZoom * event.scale);
        },
        { capture: true, passive: false }
      );

      const syncActiveSlideLetterbox = () => {
        const centeredElement = document.elementFromPoint(
          window.innerWidth / 2,
          window.innerHeight / 2
        );
        if (centeredElement?.closest?.('[data-neopresent-overview]')) return;
        // Overview cards are also slides, but their gallery/helix transforms
        // are intentionally controlled by the overview camera. Only the
        // audience host uses the fixed 1600-unit presentation canvas.
        const mountedSlides = [
          ...document.querySelectorAll('[data-neopresent-slide-host] > [data-neopresent-slide]')
        ];
        const viewport = document.querySelector('.neo-viewport');
        if (!viewport || mountedSlides.length === 0) return;
        const availableWidth = viewport.clientWidth || window.innerWidth;
        const availableHeight = viewport.clientHeight || window.innerHeight;
        mountedSlides.forEach((candidate) => {
          const candidateHost = candidate.parentElement;
          if (candidate.dataset.neopresentPdfInspection === 'true') {
            // Native PDF plugins must receive the audience viewport's real CSS
            // dimensions. Scaling a fixed 1600-unit iframe with `zoom` leaves
            // Chromium/Edge rendering and scroll geometry at the old size.
            candidate.style.alignSelf = 'stretch';
            candidate.style.flex = '1 1 auto';
            candidate.style.height = '100%';
            candidate.style.margin = '0';
            candidate.style.maxHeight = '100%';
            candidate.style.maxWidth = '100%';
            candidate.style.scale = '';
            candidate.style.transformOrigin = '';
            candidate.style.width = '100%';
            candidate.style.zoom = '1';
            candidate.dataset.neopresentUniformScale = '1';
            candidate.dataset.neopresentUniformReady = 'true';
            if (candidateHost) {
              candidateHost.style.alignItems = 'stretch';
              candidateHost.style.display = 'flex';
              candidateHost.style.height = '100%';
              candidateHost.style.justifyContent = 'stretch';
              candidateHost.style.maxHeight = '100%';
              candidateHost.style.maxWidth = '100%';
              candidateHost.style.minHeight = '0';
              candidateHost.style.minWidth = '0';
              candidateHost.style.overflow = 'hidden';
              candidateHost.style.width = '100%';
            }
            return;
          }
          const aspectMatch = String(
            audienceAspect || candidate.dataset.neopresentAspect || '16:9'
          ).match(/^\s*(\d+(?:\.\d+)?)\s*:\s*(\d+(?:\.\d+)?)\s*$/);
          if (!aspectMatch) return;
          const ratio = Number(aspectMatch[1]) / Number(aspectMatch[2]);
          if (!Number.isFinite(ratio) || ratio <= 0) return;
          const designWidth = Number(candidate.dataset.neopresentDesignWidth) || 1600;
          const designHeight =
            Number(candidate.dataset.neopresentDesignHeight) || designWidth / ratio;
          const uniformScale = Math.min(
            availableWidth / designWidth,
            availableHeight / designHeight
          );
          const resolvedScale =
            Number.isFinite(uniformScale) && uniformScale > 0 ? String(uniformScale) : '1';
          // Keep native PDF plugins in layout-aware CSS zoom. Applying a
          // transform-style `scale` to an iframe preserves its appearance but
          // leaves Chromium/Edge scrollbar geometry in the unscaled coordinate
          // system: the horizontal bar can disappear and the vertical thumb
          // cannot reach the true document bottom. PDF page fitting now runs
          // after layout, so native and canvas slides can use the same zoom path.
          const layoutScale = resolvedScale;
          const paintedScale = '';
          if (
            candidate.dataset.neopresentUniformReady === 'true' &&
            candidate.style.height === `${designHeight}px` &&
            candidate.style.width === `${designWidth}px` &&
            candidate.style.zoom === layoutScale &&
            candidate.style.scale === paintedScale
          )
            return;
          candidate.style.alignSelf = 'center';
          candidate.style.flex = '0 0 auto';
          candidate.style.height = `${designHeight}px`;
          candidate.style.margin = 'auto';
          candidate.style.maxHeight = 'none';
          candidate.style.maxWidth = 'none';
          candidate.style.scale = paintedScale;
          candidate.style.transformOrigin = '';
          candidate.style.width = `${designWidth}px`;
          candidate.style.zoom = layoutScale;
          candidate.dataset.neopresentUniformScale = String(uniformScale);
          candidate.dataset.neopresentUniformReady = 'true';
          if (candidateHost) {
            candidateHost.style.alignItems = 'center';
            candidateHost.style.display = 'flex';
            candidateHost.style.height = '100%';
            candidateHost.style.justifyContent = 'center';
            candidateHost.style.maxHeight = '100%';
            candidateHost.style.maxWidth = '100%';
            candidateHost.style.minHeight = '0';
            candidateHost.style.minWidth = '0';
            candidateHost.style.overflow = 'hidden';
            candidateHost.style.width = '100%';
          }
        });
        const activeSlide = mountedSlides.find(
          (candidate) =>
            candidate.closest(
              '[data-neopresent-slide-host].neo-layout-card-item.neo-active-item'
            ) ||
            (candidate.classList.contains('neo-active-item') &&
              candidate.classList.contains('neo-layout-card-item'))
        );
        const slide =
          activeSlide ||
          centeredElement?.closest?.('[data-neopresent-slide]') ||
          mountedSlides.find((candidate) => {
            const style = getComputedStyle(candidate);
            return style.display !== 'none' && candidate.getClientRects().length > 0;
          });
        const color = slide?.dataset.neopresentLetterboxColor;
        if (!slide || !color) return;
        document.documentElement.style.setProperty('--neopresent-letterbox-color', color);
        document.documentElement.style.backgroundColor = color;
        document.body.style.backgroundColor = color;
        const activeHost = slide.closest('[data-neopresent-slide-host]') || slide.parentElement;
        if (activeHost) activeHost.style.backgroundColor = color;
        if (audienceSlideIndex !== lastReadyAudienceSlideIndex) {
          lastReadyAudienceSlideIndex = audienceSlideIndex;
          const readyIndex = audienceSlideIndex;
          requestAnimationFrame(() => {
            if (readyIndex !== audienceSlideIndex) return;
            presenterStateChannel.postMessage({
              type: 'audience-slide-ready',
              index: readyIndex
            });
            if (viewerReloadedForPresenter) {
              audienceAwaitingPresenterPreview = true;
              viewerReloadedForPresenter = false;
              presenterStateChannel.postMessage({ type: 'viewer-reload-complete' });
            }
            if (announceViewerReload) {
              announceViewerReload = false;
              presenterStateChannel.postMessage({ type: 'viewer-window-refreshed' });
            }
          });
        }
      };
      let uniformScaleFrame = 0;
      const scheduleUniformSlideScale = () => {
        if (uniformScaleFrame) return;
        uniformScaleFrame = requestAnimationFrame(() => {
          uniformScaleFrame = 0;
          syncActiveSlideLetterbox();
        });
      };
      const uniformSlideObserver = new MutationObserver((records) => {
        if (
          records.some(
            (record) =>
              (record.type === 'attributes' &&
                record.target instanceof Element &&
                record.target.matches('[data-neopresent-slide], [data-neopresent-slide-host]')) ||
              [...record.addedNodes].some(
                (node) =>
                  node instanceof Element &&
                  (node.matches('[data-neopresent-slide]') ||
                    node.querySelector('[data-neopresent-slide]'))
              )
          )
        ) {
          /*
           * Mutation observers run before the browser's next paint. Size a
           * newly mounted card immediately in that microtask so the hidden
           * preparation state and the correctly scaled slide belong to the
           * same rendered frame. Deferring this to requestAnimationFrame
           * exposed one empty frame on every slide change.
           */
          syncActiveSlideLetterbox();
          requestAnimationFrame(() => renderAudienceAnnotations());
        }
      });
      uniformSlideObserver.observe(document.body, {
        attributeFilter: ['class'],
        attributes: true,
        childList: true,
        subtree: true
      });
      syncActiveSlideLetterbox();
      const uniformViewport = document.querySelector('.neo-viewport');
      const uniformResizeObserver =
        uniformViewport && typeof ResizeObserver !== 'undefined'
          ? new ResizeObserver(scheduleUniformSlideScale)
          : null;
      if (uniformViewport) uniformResizeObserver?.observe(uniformViewport);
      document.addEventListener('fullscreenchange', () => scheduleUniformSlideScale());
      window.addEventListener('resize', scheduleUniformSlideScale);

      const dispatchPresenterCommand = (direction, paused) => {
        if (direction === 'set-animations-paused') {
          setAudienceAnimationsPaused(Boolean(paused));
          return;
        }
        const keys = {
          next: 'ArrowRight',
          previous: 'ArrowLeft',
          first: 'Home',
          last: 'End',
          notes: 'N',
          toc: 'T',
          filmstrip: 'V',
          overview: 'O',
          controls: 'C',
          pdf: 'P',
          'overview-close': '0',
          'overview-select': 'Enter'
        };
        const key = keys[direction];
        const viewport = document.querySelector('.neo-viewport');
        if (!key || !viewport) return;
        viewport.dispatchEvent(
          new KeyboardEvent('keydown', {
            bubbles: true,
            cancelable: true,
            key
          })
        );
      };

      presenterControlChannel.onmessage = (event) => {
        if (event.data?.direction === 'toc-focus') {
          applyViewerTocFocus(event.data.index);
          return;
        }
        dispatchPresenterCommand(event.data?.direction, event.data?.paused);
      };
      window.addEventListener('storage', (event) => {
        if (event.key !== 'neopresent-presenter-command' || !event.newValue) return;
        try {
          dispatchPresenterCommand(JSON.parse(event.newValue).direction);
        } catch {
          // Ignore malformed commands from unrelated local storage users.
        }
      });
      window.addEventListener('storage', (event) => {
        if (event.key !== chartTooltipStorageKey || !event.newValue) return;
        try {
          const message = JSON.parse(event.newValue);
          if (message?.type === 'chart-tooltip') updatePresenterChartTooltip(message);
        } catch {
          // Ignore malformed values from unrelated local storage users.
        }
      });
    </script>
  </body>
</html>
