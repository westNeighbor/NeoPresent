name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          zip -r NeoPresent-${{ github.ref_name }}.zip . \
            -x ".git/*" \
               ".github/*" \
               ".DS_Store" \
               "__MACOSX/*" \
               "release_notes/*" \
               "resources/*" \

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NeoPresent-${{ github.ref_name }}.zip
          body_path: release_notes/${{ github.ref_name }}.md
          generate_release_notes: false

