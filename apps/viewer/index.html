<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>NeoPresent Viewer</title>
    <link rel="stylesheet" href="./node_modules/katex/dist/katex.min.css" />
    <style>
      :root {
        --neopresent-letterbox-color: #020617;
      }

      html,
      body {
        background: var(--neopresent-letterbox-color);
        height: 100%;
        margin: 0;
        min-height: 100%;
        min-width: 100%;
        overflow: hidden;
        width: 100%;
      }

      .neo-viewport {
        background: var(--neopresent-letterbox-color) !important;
        height: 100vh !important;
        inset: 0 !important;
        min-height: 100vh !important;
        min-width: 100vw !important;
        overflow: hidden !important;
        position: fixed !important;
        width: 100vw !important;
      }

      /*
       * Neo's nested card layouts otherwise use the zoomed slide as their
       * intrinsic height. Keep the entire audience-stage chain full-height so
       * the stable slide host has real letterbox space in which to center.
       */
      .neo-viewport > .neo-container.neo-layout-card,
      .neo-viewport
        > .neo-container.neo-layout-card
        > .neo-container.neo-layout-card.neo-layout-card-item,
      [data-neopresent-slide-host] {
        height: 100% !important;
        min-height: 100% !important;
        width: 100% !important;
      }

      [data-neopresent-slide-host] {
        align-items: center !important;
        display: flex !important;
        justify-content: center !important;
      }

      /*
       * Match the presenter preview's prepare-then-reveal behavior. A newly
       * mounted slide stays hidden for its first layout pass so its 1600-unit
       * design canvas can never flash at an unscaled size.
       */
      [data-neopresent-slide-host]
        > [data-neopresent-slide]:not([data-neopresent-uniform-ready='true']) {
        visibility: hidden !important;
      }

      .neo-viewport .neopresent-toc-panel {
        background: color-mix(in srgb, var(--np-panel) 64%, transparent) !important;
        border-color: var(--np-border) !important;
        color: var(--np-foreground) !important;
        display: none !important;
      }

      html.neopresent-toc-open .neo-viewport .neopresent-toc-panel {
        display: block !important;
      }

      .neo-viewport .neopresent-toc-panel a.neopresent-toc-current {
        background: color-mix(in srgb, var(--np-accent) 20%, transparent) !important;
        box-shadow: inset 3px 0 0 var(--np-accent);
        color: var(--np-foreground) !important;
      }

      .neo-viewport .neopresent-toc-panel a.neopresent-toc-focus {
        background: color-mix(in srgb, var(--np-accent) 18%, transparent) !important;
        box-shadow: none;
        color: var(--np-foreground) !important;
        outline: 2px solid var(--np-accent);
        outline-offset: -2px;
      }

      .neo-viewport .neopresent-filmstrip-panel {
        display: none !important;
      }

      .neopresent-filmstrip-snapshot {
        pointer-events: none !important;
        transition: opacity 140ms ease-out;
        z-index: 46 !important;
      }

      html.neopresent-filmstrip-open .neo-viewport .neopresent-filmstrip-panel {
        display: flex !important;
      }

      /* Overview thumbnails always show their stable final frame. This also
       * catches generated plot/SVG animation rules that are not represented
       * by inline VDOM styles. Card and camera transitions live outside this
       * marked preview subtree and remain active. */
      [data-neopresent-overview-preview],
      [data-neopresent-overview-preview] * {
        animation-delay: -100000s !important;
        animation-fill-mode: both !important;
        animation-play-state: paused !important;
        transition: none !important;
      }

      html:fullscreen,
      html:fullscreen body,
      html:fullscreen .neo-viewport {
        background: var(--neopresent-letterbox-color) !important;
        height: 100vh !important;
        max-height: 100vh !important;
        max-width: 100vw !important;
        min-height: 100vh !important;
        min-width: 100vw !important;
        overflow: hidden !important;
        width: 100vw !important;
      }

      html[data-neopresent-zoomed='true'] {
        overflow: hidden !important;
      }

      html[data-neopresent-zoomed='true'] body {
        min-height: 100vh;
        min-width: 100vw;
        overflow: hidden !important;
      }

      .neopresent-zoom-scroll-surface {
        left: 0;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        top: 0;
        z-index: -1;
      }

      .neopresent-zoom-scrollbar {
        accent-color: #64748b;
        display: none;
        margin: 0;
        position: fixed;
        z-index: 10001;
      }

      .neopresent-zoom-scrollbar-horizontal {
        bottom: 4px;
        height: 14px;
        left: 8px;
        width: calc(100vw - 32px);
      }

      .neopresent-zoom-scrollbar-vertical {
        direction: rtl;
        height: calc(100vh - 32px);
        right: 4px;
        top: 8px;
        width: 14px;
        writing-mode: vertical-lr;
      }

      /* A sharp content magnifier with a liquid-glass rim. The slide inside
       * the lens is enlarged normally; the glass is decorative only, so text
       * and scientific plots are never optically distorted. */
      .neopresent-magnifier {
        backdrop-filter: blur(1px) saturate(1.18);
        -webkit-backdrop-filter: blur(1px) saturate(1.18);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.46), transparent 29%, rgba(255, 255, 255, 0.1)),
          rgba(255, 255, 255, 0.08);
        border: 3px solid rgba(255, 255, 255, 0.82);
        border-radius: 50%;
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.35),
          0 14px 32px rgba(15, 23, 42, 0.34),
          inset 0 2px 5px rgba(255, 255, 255, 0.72),
          inset 0 -5px 10px rgba(15, 23, 42, 0.15);
        height: 260px;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
        position: fixed;
        transform: translate(-50%, -50%);
        transition: opacity 100ms ease-out;
        width: 260px;
        z-index: 10002;
      }

      .neopresent-magnifier::after {
        border: 1px solid rgba(255, 255, 255, 0.64);
        border-radius: inherit;
        content: '';
        inset: 6px;
        pointer-events: none;
        position: absolute;
        z-index: 2;
      }

      .neopresent-magnifier-content {
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        position: absolute;
      }

      .neopresent-magnifier-slide {
        isolation: isolate;
        left: 0;
        margin: 0 !important;
        max-height: none !important;
        max-width: none !important;
        position: absolute !important;
        top: 0;
        transform-origin: top left !important;
      }

      @keyframes neopresent-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes neopresent-slide-left {
        from {
          opacity: 0;
          transform: translateX(8vw);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes neopresent-slide-right {
        from {
          opacity: 0;
          transform: translateX(-8vw);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes neopresent-slide-up {
        from {
          opacity: 0;
          transform: translateY(8vh);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes neopresent-slide-down {
        from {
          opacity: 0;
          transform: translateY(-8vh);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes neopresent-zoom-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes neopresent-flip-in {
        from {
          opacity: 0;
          transform: perspective(1000px) rotateY(-15deg) scale(0.97);
        }
        to {
          opacity: 1;
          transform: perspective(1000px) rotateY(0) scale(1);
        }
      }

      @keyframes neopresent-helix-card-move {
        from {
          opacity: var(--neopresent-helix-from-opacity);
          transform: var(--neopresent-helix-from-transform);
        }
        to {
          opacity: var(--neopresent-helix-to-opacity);
          transform: var(--neopresent-helix-to-transform);
        }
      }

      @keyframes neopresent-chart-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes neopresent-chart-rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes neopresent-chart-grow {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes neopresent-chart-draw {
        from {
          opacity: 0;
          stroke-dashoffset: 1;
        }
        to {
          opacity: 1;
          stroke-dashoffset: 0;
        }
      }
      @keyframes neopresent-chart-reveal-x {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes neopresent-table-glow {
        from {
          filter: brightness(0.96) saturate(1);
        }
        to {
          filter: brightness(1.38) saturate(1.35);
        }
      }
      @keyframes neopresent-table-light-flow {
        from {
          background-position: 180% 0;
        }
        to {
          background-position: -80% 0;
        }
      }
      @keyframes neopresent-plot-glow {
        from {
          filter: drop-shadow(0 0 1px var(--neopresent-highlight-color)) brightness(0.98);
        }
        to {
          filter: drop-shadow(0 0 9px var(--neopresent-highlight-color)) brightness(1.32)
            saturate(1.25);
        }
      }
      @keyframes neopresent-plot-flow {
        0% {
          filter: drop-shadow(-8px 0 1px transparent) brightness(0.98);
        }
        45% {
          filter: drop-shadow(-2px 0 5px var(--neopresent-highlight-color)) brightness(1.25);
        }
        55% {
          filter: drop-shadow(2px 0 8px var(--neopresent-highlight-color)) brightness(1.38);
        }
        100% {
          filter: drop-shadow(8px 0 1px transparent) brightness(0.98);
        }
      }
      @keyframes neopresent-text-typing {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes neopresent-text-caret {
        0%,
        100% {
          border-right-color: transparent;
        }
        50% {
          border-right-color: var(--neopresent-typing-cursor-color, currentColor);
        }
      }
      @keyframes neopresent-block-enter-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes neopresent-block-enter-grow {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes neopresent-pdf-enter-grow {
        from {
          opacity: 0;
          transform: scale(0.82);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes neopresent-block-enter-zoom {
        from {
          max-height: 0;
          opacity: 0;
          zoom: 35%;
        }
        to {
          max-height: 100vh;
          opacity: 1;
          zoom: var(--neopresent-block-base-zoom, 100%);
        }
      }
      @keyframes neopresent-block-enter-rise {
        from {
          opacity: 0;
          transform: translateY(1.5rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes neopresent-block-shrink {
        from {
          opacity: 1;
          zoom: var(--neopresent-block-base-zoom, 100%);
        }
        to {
          opacity: 1;
          zoom: var(--neopresent-block-target-zoom, 35%);
        }
      }
      @keyframes neopresent-block-replace {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0.98);
        }
      }

      .neo-animation-wrapper {
        transition: transform 300ms ease;
      }

      .neopresent-viewer-controls.neo-toolbar {
        align-items: center !important;
        backdrop-filter: blur(24px) saturate(155%);
        -webkit-backdrop-filter: blur(24px) saturate(155%);
        background: color-mix(
          in srgb,
          var(--np-controls-panel, var(--np-panel)) 70%,
          transparent
        ) !important;
        border-top: 1px solid var(--np-border) !important;
        box-shadow:
          0 -1px 0 rgba(255, 255, 255, 0.14) inset,
          0 -14px 36px rgba(0, 0, 0, 0.18);
        color: var(--np-foreground) !important;
        display: flex !important;
        flex-flow: row nowrap !important;
        gap: 0.5rem;
        justify-content: center !important;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.55rem max(0.75rem, env(safe-area-inset-right)) 0.55rem
          max(0.75rem, env(safe-area-inset-left));
        scrollbar-width: thin;
      }

      .neopresent-viewer-controls > * {
        flex: 0 0 auto !important;
      }

      .neopresent-viewer-controls .neo-button {
        background: color-mix(
          in srgb,
          var(--np-controls-surface, var(--np-surface)) 78%,
          transparent
        ) !important;
        border: 1px solid var(--np-border) !important;
        border-radius: 999px !important;
        box-shadow:
          0 1px 1px rgba(255, 255, 255, 0.1) inset,
          0 5px 14px rgba(0, 0, 0, 0.14);
        color: inherit !important;
        height: 2.55rem !important;
        min-width: max-content;
        padding: 0 1rem !important;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease !important;
      }

      .neopresent-viewer-controls .neo-button-text {
        color: currentColor !important;
        font:
          650 0.86rem/1 system-ui,
          sans-serif !important;
        letter-spacing: 0.01em;
        text-transform: none !important;
      }

      .neopresent-viewer-controls .neo-button:hover {
        background: color-mix(in srgb, var(--np-accent) 24%, transparent) !important;
        border-color: color-mix(in srgb, var(--np-accent) 62%, transparent) !important;
        box-shadow:
          0 1px 1px rgba(255, 255, 255, 0.16) inset,
          0 7px 18px rgba(0, 0, 0, 0.2);
        transform: translateY(-1px);
      }

      .neopresent-viewer-controls .neo-button:active {
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.2) inset;
        transform: translateY(1px) scale(0.98);
      }

      .neopresent-viewer-controls .neo-button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--np-accent) 55%, transparent) !important;
        outline-offset: 2px;
      }

      .neopresent-viewer-controls .neo-button.neo-disabled {
        box-shadow: none;
        cursor: not-allowed;
        opacity: 0.38 !important;
        transform: none;
      }

      .neopresent-viewer-controls .neo-label {
        border-left: 1px solid var(--np-border);
        border-right: 1px solid var(--np-border);
        color: var(--np-muted) !important;
        font:
          700 0.84rem/1 system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        margin: 0 0.15rem;
        opacity: 0.82;
        padding: 0.4rem 0.85rem;
        white-space: nowrap;
      }

      @media (max-width: 760px) {
        .neopresent-viewer-controls.neo-toolbar {
          justify-content: flex-start !important;
        }

        .neopresent-viewer-controls .neo-button {
          padding: 0 0.75rem !important;
        }
      }

      .neopresent-help-dialog {
        align-items: center;
        backdrop-filter: blur(5px) saturate(0.72);
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 1.5rem;
        position: fixed;
        z-index: 10000;
      }

      .neopresent-help-dialog[hidden] {
        display: none;
      }

      .neopresent-help-card {
        backdrop-filter: blur(20px) saturate(1.16);
        background: color-mix(in srgb, var(--np-panel, #0f172a) 88%, transparent);
        border: 1px solid var(--np-border, #52658f);
        border-radius: 1rem;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
        color: var(--np-foreground, #f8fafc);
        max-height: min(82vh, 760px);
        max-width: 620px;
        overflow: auto;
        padding: 1.5rem;
        width: 100%;
      }

      .neopresent-help-heading {
        align-items: center;
        display: flex;
        gap: 0.75rem;
        justify-content: space-between;
      }

      .neopresent-help-heading h2 {
        font-size: 1.35rem;
        margin: 0;
      }

      .neopresent-help-status {
        background: color-mix(in srgb, var(--np-accent, #38bdf8) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--np-accent, #38bdf8) 55%, transparent);
        border-radius: 999px;
        color: var(--np-accent, #7dd3fc);
        font-size: 0.78rem;
        font-weight: 750;
        padding: 0.3rem 0.65rem;
      }

      .neopresent-help-description {
        color: var(--np-muted, #94a3b8);
        line-height: 1.45;
        margin: 0.75rem 0 1.1rem;
      }

      .neopresent-help-grid {
        display: grid;
        gap: 0.62rem 1.1rem;
        grid-template-columns: max-content minmax(0, 1fr);
      }

      .neopresent-help-grid kbd {
        align-self: start;
        background: color-mix(in srgb, var(--np-surface, #1e293b) 88%, transparent);
        border: 1px solid var(--np-border, #52658f);
        border-radius: 0.38rem;
        box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.12);
        color: var(--np-foreground, #f8fafc);
        font: 700 0.82rem ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 0.24rem 0.48rem;
        text-align: center;
      }

      .neopresent-help-grid span {
        line-height: 1.35;
      }

    </style>
  </head>
  <body>
    <div
      aria-hidden="true"
      aria-labelledby="neopresent-viewer-help-title"
      aria-modal="true"
      class="neopresent-help-dialog"
      id="neopresent-viewer-help"
      role="dialog"
      hidden
    >
      <div class="neopresent-help-card" id="neopresent-viewer-help-card" tabindex="-1">
        <div class="neopresent-help-heading">
          <h2 id="neopresent-viewer-help-title">Viewer shortcuts</h2>
          <span class="neopresent-help-status" id="neopresent-viewer-help-status"></span>
        </div>
        <p class="neopresent-help-description" id="neopresent-viewer-help-description"></p>
        <div class="neopresent-help-grid" id="neopresent-viewer-help-grid"></div>
      </div>
    </div>
    <script>
      /*
       * Browsers classify http://localhost as trustworthy but classify a LAN
       * IPv4 address as insecure. Neo uses UUIDs only as transient client
       * identifiers, so provide that small API when randomUUID is withheld on
       * an otherwise useful local-network viewer URL.
       */
      (() => {
        const createUuid = () => {
          const hex = () =>
            Math.floor(Math.random() * 0x100000000)
              .toString(16)
              .padStart(8, '0');
          return `${hex()}-${hex().slice(0, 4)}-4${hex().slice(1, 4)}-${(8 + Math.floor(Math.random() * 4)).toString(16)}${hex().slice(1, 4)}-${hex()}${hex().slice(0, 4)}`;
        };
        if (!globalThis.crypto) Object.defineProperty(globalThis, 'crypto', { value: {} });
        if (typeof globalThis.crypto.randomUUID !== 'function') {
          Object.defineProperty(globalThis.crypto, 'randomUUID', { value: createUuid });
        }
      })();
    </script>
    <script>
      (() => {
        const channel = new BroadcastChannel('neopresent-deeplink');
        const publishHash = () =>
          channel.postMessage({
            type: 'open-slide',
            hash: window.location.hash
          });
        const freezeOverviewPreviewAnimations = (overview) => {
          overview
            .querySelectorAll(
              '[data-neopresent-overview-preview]:not([data-neopresent-animations-frozen])'
            )
            .forEach((preview) => {
              preview.dataset.neopresentAnimationsFrozen = 'true';
              preview.getAnimations({ subtree: true }).forEach((animation) => {
                try {
                  const timing = animation.effect?.getComputedTiming();
                  if (Number.isFinite(timing?.endTime)) animation.currentTime = timing.endTime;
                  animation.pause();
                } catch {
                  // A browser may expose a read-only or already-finished
                  // animation. The CSS freeze above remains the fallback.
                }
              });
              preview.querySelectorAll('svg').forEach((svg) => {
                try {
                  svg.setCurrentTime?.(100000);
                  svg.pauseAnimations?.();
                } catch {
                  // Non-SMIL SVG implementations need no extra handling.
                }
              });
            });
        };
        const updateOverviewFocus = ({ direction = 0, index = 0, mode = 'grid' }) => {
          const overview = document.querySelector(`[data-neopresent-overview="${mode}"]`);
          if (!overview) return;
          freezeOverviewPreviewAnimations(overview);
          const cards = [...overview.querySelectorAll('[data-neopresent-overview-card]')];
          const selectedIndex = Math.max(0, Math.min(Number(index) || 0, cards.length - 1));
          const galleryColumnCount = Math.max(1, Math.ceil(cards.length / 3));
          const selectedGalleryRow = Math.floor(selectedIndex / galleryColumnCount);
          const selectedColumnInRow = selectedIndex % galleryColumnCount;
          const selectedGalleryColumn =
            selectedGalleryRow % 2 === 0
              ? selectedColumnInRow
              : galleryColumnCount - 1 - selectedColumnInRow;

          if (mode === 'grid') {
            const previous = overview.querySelector(
              '[data-neopresent-overview-selected="true"]'
            );
            const selected = cards[selectedIndex];
            if (previous && previous !== selected) {
              previous.dataset.neopresentOverviewSelected = 'false';
              previous.style.boxShadow = '0 8px 20px rgba(0,0,0,.18)';
              previous.style.transform = '';
              previous.style.zIndex = '1';
            }
            if (selected) {
              selected.dataset.neopresentOverviewSelected = 'true';
              selected.style.boxShadow =
                '0 0 0 4px rgba(251,191,36,.28), 0 16px 34px rgba(0,0,0,.35)';
              selected.style.transform = '';
              selected.style.zIndex = '2';
              selected.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            return;
          }

          cards.forEach((card, cardIndex) => {
            const selected = cardIndex === selectedIndex;
            const unselectedShadow = '0 8px 20px rgba(0,0,0,.18)';
            card.dataset.neopresentOverviewSelected = String(selected);
            card.dataset.neopresentGallerySelected = mode === 'gallery' ? String(selected) : '';

            if (mode === 'gallery') {
              const row = Math.floor(cardIndex / galleryColumnCount);
              const columnInRow = cardIndex % galleryColumnCount;
              const column =
                row % 2 === 0 ? columnInRow : galleryColumnCount - 1 - columnInRow;

        slideIndex = audienceSlideIndex
      ) => {
        const paths = annotationsBySlide.get(slideIndex) || [];
        const nextPaths = eraseAnnotationPaths(paths, point, radius);
        annotationsBySlide.set(slideIndex, nextPaths);
        if (slideIndex !== audienceSlideIndex) return;
        annotationPaths = nextPaths;
        renderAudienceAnnotations();
      };
      const clearAudienceAnnotations = (slideIndex) => {
        const targetSlide = Number.isInteger(slideIndex) ? slideIndex : audienceSlideIndex;
        annotationsBySlide.set(targetSlide, []);
        if (targetSlide !== audienceSlideIndex) return;
        annotationPaths = [];
        activeAnnotationPath = undefined;

      };

      const updateBlackoutScreen = (visible) => {
        if (!blackoutScreen) {

            background: '#000000',
            inset: '0',
            opacity: '0',
            pointerEvents: 'none',
            position: 'fixed',

            zIndex: '10000'
          });
          document.body.append(blackoutScreen);
        }
        blackoutScreen.style.opacity = visible ? '1' : '0';
      };

      const updateSpotlightScreen = ({
        x = 0.5,
        y = 0.5,
        visible,
        size = 14,
        ringColor = spotlightRingStyle.ringColor,
        ringVisible = spotlightRingStyle.ringVisible,
        ringWidth = spotlightRingStyle.ringWidth

            bottom: 'auto',
            left: '0',
            opacity: '0',
            pointerEvents: 'none',
            position: 'fixed',
            right: 'auto',
            top: '0',
            transition: 'opacity 120ms ease-out',

          });

        spotlightRing.style.borderColor = spotlightRingStyle.ringColor;
        spotlightRing.style.setProperty('border-color', spotlightRingStyle.ringColor, 'important');
        spotlightRing.style.left = `${centerX - outerRadius}px`;
        spotlightRing.style.top = `${centerY - outerRadius}px`;
        spotlightRing.style.width = `${outerRadius * 2}px`;
        spotlightRing.style.height = `${outerRadius * 2}px`;
        spotlightRing.style.opacity = visible && spotlightRingStyle.ringVisible ? '1' : '0';
      };
      const applySpotlightRingStyle = (style) => {
        Object.assign(spotlightRingStyle, style);
        if (!spotlightRing) return;
        spotlightRing.style.border = `${Math.max(1, Number(spotlightRingStyle.ringWidth))}px solid ${spotlightRingStyle.ringColor}`;
        spotlightRing.style.borderColor = spotlightRingStyle.ringColor;
        spotlightRing.style.setProperty('border-color', spotlightRingStyle.ringColor, 'important');
        spotlightRing.style.opacity =
          spotlightEnabled && spotlightRingStyle.ringVisible ? '1' : '0';
      };
      const loadedLaserFonts = new Set();

      const loadLaserFont = async ({ font, fontData }) => {

          loadedLaserFonts.add(font);
